name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, lint and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Render dates/times as officers in India would see them.
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Runs every spec: visual (375/768/1440), flows, boundary-file guard and the
      # geographic map against the committed public/geo file. BOUNDARY_FIXTURE is
      # unset here, so no external boundary file is needed.
      - name: Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: qa/screenshots/
          retention-days: 14

      # Pre-built app for the demo laptop: serve with `npx serve -s dist`.
      - name: Upload dist
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30
