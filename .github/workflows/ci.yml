name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, lint and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Render dates/times as officers in India would see them.
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Two steps so each gets its own annotation quota (GitHub shows ~10 failures
      # per step): behaviour/data checks first, then the screenshot sweep.
      # BOUNDARY_FIXTURE is unset, so the geographic checks use the committed file.
      - name: Playwright — behaviour, data and boundary checks
        env:
          PW_REPORT_DIR: playwright-report/behaviour
          PW_RESULTS_DIR: test-results/behaviour
        run: npx playwright test qa/flows.spec.ts qa/phase5.spec.ts qa/phase6.spec.ts qa/geo.spec.ts qa/boundary-file.spec.ts

      - name: Playwright — visual (375 / 768 / 1440 px)
        if: ${{ !cancelled() }}
        env:
          PW_REPORT_DIR: playwright-report/visual
          PW_RESULTS_DIR: test-results/visual
        run: npx playwright test qa/visual.spec.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: qa/screenshots/
          retention-days: 14

      # Pre-built app for the demo laptop: serve with `npx serve -s dist`.
      - name: Upload dist
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 90
